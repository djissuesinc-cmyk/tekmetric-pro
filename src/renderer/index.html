<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tekmetric Pro — Craig's Leaside Automotive</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="../../assets/logo.svg" alt="Craig's Leaside Automotive">
      </div>
      <nav class="nav" aria-label="Main">
        <button type="button" class="nav-btn" data-view="dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
          <span>Dashboard</span>
        </button>
        <button type="button" class="nav-btn" data-view="calendar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v3M17 3v3M4 9h16M6 5h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></svg>
          <span>Calendar</span>
        </button>
        <button type="button" class="nav-btn" data-view="repairs">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8M9 3h6v3H9zM6 7h12v14H6zM9 12h6M9 16h4"/></svg>
          <span>Repair orders</span>
        </button>
        <button type="button" class="nav-btn" data-view="diagnostics">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>
          <span>Diagnostics</span>
        </button>
        <button type="button" class="nav-btn" data-view="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="17" r="2"/></svg>
          <span>Settings</span>
        </button>
      </nav>
      <div class="side-foot">
        <div id="side-version">Tekmetric Pro</div>
        <div>Unofficial · not Tekmetric</div>
      </div>
    </aside>
    <section class="main">
      <header class="topbar">
        <div class="top-titles">
          <p class="eyebrow" id="eyebrow"></p>
          <h1 id="title"></h1>
        </div>
        <div class="top-actions">
          <span id="shop-pill" class="pill"></span>
          <button type="button" id="dark-toggle" class="btn btn-ghost">Dark mode</button>
        </div>
      </header>
      <div id="view" class="view"></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <script src="../shared/text.js"></script>
  <script src="app.js"></script>
</body>
</html>
